version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: soc-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: cybersecurity_dashboard
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - soc-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: soc-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/cybersecurity_dashboard
      - JWT_SECRET=${JWT_SECRET:-cybersecurity_secret_key_2024}
      - CLIENT_URL=http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - soc-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: soc-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_SOCKET_URL=http://localhost:5000
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - soc-network

volumes:
  mongodb_data:

networks:
  soc-network:
    driver: bridge
